<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe de Visita - PWA</title>
  <style>
    /* --- ESTILOS GENERALES --- */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f4f4; padding: 20px; }
    .informe-container { max-width: 800px; margin: 0 auto; background-color: #ffffff; border: 1px solid #15324b; padding: 20px; }
    
    /* --- TÍTULOS Y SECCIONES --- */
    .seccion-titulo { background-color: #15324b; color: white; padding: 6px 10px; font-weight: bold; font-size: 13px; margin-top: 15px; }

    /* --- CUADRÍCULA DE FOTOS --- */
    .grid-fotos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; border: 1px solid #15324b; border-top: none; background-color: #fff; margin-bottom: 15px; }
    .tarjeta-foto { border: 1px solid #15324b; padding: 8px; text-align: center; background-color: #fff; page-break-inside: avoid; break-inside: avoid; }
    .tarjeta-foto img { width: 100%; height: 160px; object-fit: cover; border: 1px solid #ddd; margin-bottom: 5px; display: block; }
    .pie-foto { font-size: 10px; color: #15324b; font-weight: bold; }

    /* --- APARTADO DE FIRMAS EN 3 COLUMNAS HORIZONTALES --- */
    .seccion-firmas { margin-top: 15px; page-break-inside: avoid; break-inside: avoid; }
    .firmas-container { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding: 15px 10px; border: 1px solid #15324b; border-top: none; background-color: #fff; }
    .firma-box { flex: 1; text-align: center; padding: 5px; page-break-inside: avoid; break-inside: avoid; }
    .firma-box img { max-height: 60px; width: auto; max-width: 100%; object-fit: contain; margin-bottom: 5px; display: block; margin-left: auto; margin-right: auto; }
    .firma-titulo { font-size: 10px; font-weight: bold; color: #15324b; border-top: 1px solid #15324b; padding-top: 5px; margin-top: 5px; line-height: 1.2; }

    /* --- REGLAS DE IMPRESIÓN Y PDF (Garantizan que las fotos y firmas salgan siempre) --- */
    @media print {
      body {
        background-color: #fff;
        padding: 0;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .informe-container { border: none; padding: 0; }
      img {
        max-width: 100% !important;
        height: auto !important;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .tarjeta-foto, .firma-box, .seccion-fotos, .seccion-firmas {
        page-break-inside: avoid;
        break-inside: avoid;
        border: 1px solid #15324b !important;
      }
    }
  </style>
</head>
<body>

<div class="informe-container">

  <!-- CABECERA PRINCIPAL -->
  <div style="text-align: center; background-color: #15324b; color: white; padding: 10px; font-size: 16px; font-weight: bold;">
    ACTUACIONES Y RESULTADOS
  </div>

  <!-- REGISTRO FOTOGRÁFICO -->
  <div class="seccion-titulo">REGISTRO FOTOGRÁFICO</div>
  <div class="grid-fotos" id="contenedor-fotos">
    <!-- Foto 1 -->
    <div class="tarjeta-foto">
      <img src="ruta_o_base64_foto1.jpg" alt="Foto 1" onerror="this.parentElement.style.display='none'" />
      <div class="pie-foto">Foto 1: Detalle de deficiencia</div>
    </div>
    <!-- Foto 2 -->
    <div class="tarjeta-foto">
      <img src="ruta_o_base64_foto2.jpg" alt="Foto 2" onerror="this.parentElement.style.display='none'" />
      <div class="pie-foto">Foto 2: Medida correctora aplicada</div>
    </div>
  </div>

  <!-- VISITA REALIZADA POR: 3 CUADROS HORIZONTALES PARA FIRMAS -->
  <div class="seccion-firmas">
    <div class="seccion-titulo" style="margin-top: 0;">VISITA REALIZADA POR:</div>
    <div class="firmas-container">
      
      <!-- Firma 1: Técnico PRL -->
      <div class="firma-box">
        <img id="img-firma-tecnico" src="ruta_firma_tecnico.png" alt="Firma Técnico PRL" onerror="this.style.display='none'" />
        <div class="firma-titulo">Fdo.: Estévez<br>Técnico PRL (UTE 3)</div>
      </div>

      <!-- Firma 2: Jefe de Obra -->
      <div class="firma-box">
        <img id="img-firma-jefe" src="ruta_firma_jefe.png" alt="Firma Jefe de Obra" onerror="this.style.display='none'" />
        <div class="firma-titulo">Fdo.: Fernando Gutierrez Lera<br>Jefe de obra</div>
      </div>

      <!-- Firma 3: Técnico de Obra -->
      <div class="firma-box">
        <img id="img-firma-auxiliar" src="ruta_firma_auxiliar.png" alt="Firma Técnico de Obra" onerror="this.style.display='none'" />
        <div class="firma-titulo">Fdo.: [Nombre Apellidos]<br>Técnico de obra</div>
      </div>

    </div>
  </div>

</div>

</body>
</html>
